name = "design-md-editor-api"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]

# D1 binding. The database_id below is a placeholder for local development.
# Before `wrangler deploy`, run `wrangler d1 create design-md-editor`
# and replace the database_id with the real one.
[[d1_databases]]
binding = "DB"
database_name = "design-md-editor"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
